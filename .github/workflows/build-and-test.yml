# Builds the solution from a clean checkout, runs all the specifications, and packs the package to see that it packs:
# for every push (ci.yml), and before the package is published (publish.yml).
# On Windows, as the controls are developed and used there, and the specifications that look at what is drawn depend on its fonts.
name: Build and test

on:
  workflow_call:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # MinVer takes the version from the tags

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Build, with warnings as errors
        run: dotnet build Mavalonia.slnx -warnaserror

      - name: Run the specifications
        run: dotnet test --solution Mavalonia.slnx --no-build

      - name: Pack the package (to see that it packs)
        run: dotnet pack Mavalonia.Markdown.Controls/Mavalonia.Markdown.Controls.csproj --configuration Release --output ./artifacts/package

      - name: Keep the frames that the specifications saved
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-frames
          path: artifacts/rendered-frames
          if-no-files-found: ignore
