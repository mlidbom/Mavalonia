# Builds the solution from a clean checkout and runs all the specifications, on every push.
# On Windows, as the controls are developed and used there, and the specifications that look at what is drawn depend on its fonts.
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Build, with warnings as errors
        run: dotnet build Mavalonia.slnx -warnaserror

      - name: Run the specifications
        run: dotnet test --solution Mavalonia.slnx --no-build

      - name: Keep the frames that the specifications saved
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-frames
          path: artifacts/rendered-frames
          if-no-files-found: ignore
